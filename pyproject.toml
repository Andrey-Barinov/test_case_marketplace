[tool.poetry]
name = "test-case-marketplace"
version = "0.1.0"
description = ""
authors = ["Andrey Barinov <barbpro89@gmail.com>"]
readme = "README.md"
#package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = {extras = ["standard"], version = "^0.115.11"}
pydantic-settings = "^2.8.1"
sqlalchemy = "^2.0.39"
alembic = "^1.15.1"
asyncpg = "^0.30.0"
gunicorn = "^23.0.0"
sqlalchemy-utils = "^0.41.2"
phonenumbers = "^9.0.1"
passlib = "^1.7.4"
celery = "^5.4.0"
rabbitmq = "^0.2.0"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
aioboto3 = "^14.1.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.10.0"
pre-commit = "^4.1.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.25.3"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope = "session"
