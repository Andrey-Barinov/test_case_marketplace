exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "tests/fixtures",
    "dict",
    "build/",
    ".ruff_cache/"
]

line-length = 80

[lint]
preview = true
select = ["E", "F", "I", "C90"]

[lint.per-file-ignores]
  # init modules can contain the local imports, logic, unused imports
"__init__.py" = ["F401"]
